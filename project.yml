name: Feins
options:
  bundleIdPrefix: ch.murtit
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Feins:
    type: application
    platform: iOS
    sources:
      - path: Feins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.murtit.feins
        PRODUCT_NAME: Feins
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Feins
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Feins hört zu, wenn du ein Gericht einsprechen möchtest."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Feins wandelt dein eingesprochenes Gericht direkt auf dem iPhone in Text um."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  FeinsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FeinsTests
    dependencies:
      - target: Feins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.murtit.feins.tests
        GENERATE_INFOPLIST_FILE: YES
  FeinsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FeinsUITests
    dependencies:
      - target: Feins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.murtit.feins.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Feins
schemes:
  Feins:
    build:
      targets:
        Feins: all
        FeinsTests: [test]
        FeinsUITests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Feins
      targets:
        - name: FeinsTests
        - name: FeinsUITests
